<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0a1a12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF99"/>
      <stop offset="100%" stop-color="#00D67F"/>
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00FF99" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00FF99" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="720" cy="280" rx="400" ry="280" fill="url(#glow)"/>
  <g transform="translate(720,280)">
    <path d="M-80,-160 Q-100,0 -80,160 Q-60,0 -80,-160" stroke="url(#accent)" stroke-width="4" fill="none"/>
    <path d="M80,-160 Q100,0 80,160 Q60,0 80,-160" stroke="url(#accent)" stroke-width="4" fill="none"/>
    <g opacity="0.5">
      <line x1="-75" y1="-100" x2="75" y2="-100" stroke="#18E38A" stroke-width="2"/>
      <line x1="-75" y1="-50" x2="75" y2="-50" stroke="#18E38A" stroke-width="2"/>
      <line x1="-75" y1="0" x2="75" y2="0" stroke="#18E38A" stroke-width="2"/>
      <line x1="-75" y1="50" x2="75" y2="50" stroke="#18E38A" stroke-width="2"/>
      <line x1="-75" y1="100" x2="75" y2="100" stroke="#18E38A" stroke-width="2"/>
    </g>
    <circle cx="-80" cy="-100" r="8" fill="#00FF99"/>
    <circle cx="80" cy="-100" r="8" fill="#00D67F"/>
    <circle cx="-80" cy="0" r="8" fill="#00D67F"/>
    <circle cx="80" cy="0" r="8" fill="#00FF99"/>
    <circle cx="-80" cy="100" r="8" fill="#00FF99"/>
    <circle cx="80" cy="100" r="8" fill="#00D67F"/>
  </g>
  <text x="80" y="200" fill="#ffffff" font-family="Inter,sans-serif" font-size="72" font-weight="800">Rewriting the</text>
  <text x="80" y="290" fill="url(#accent)" font-family="Inter,sans-serif" font-size="72" font-weight="800">Code of Life</text>
  <text x="80" y="360" fill="rgba(255,255,255,0.6)" font-family="Inter,sans-serif" font-size="24">Synvorax Labs  Molecular Engineering</text>
